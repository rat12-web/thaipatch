name: Validate catalog changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate canonical data and source adapters
        run: |
          python tools/build.py --check
          python .sync/test_refresh.py
          python .sync/refresh.py --check
      - name: Offline browser smoke
        run: npm test
