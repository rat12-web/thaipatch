name: Refresh catalog and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: romthai-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check generated build
        run: python tools/build.py --check

      - name: Refresh known source records
        if: github.event_name != 'push'
        run: python .sync/refresh.py

      - name: Fast python validation
        run: |
          python .sync/test_refresh.py
          python .sync/refresh.py --check
          python tools/build.py --check

      - name: Evaluate execution necessity
        id: check_proceed
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if git diff --quiet catalog.json app.js; then
              echo "should_run=false" >> $GITHUB_OUTPUT
              echo "No catalog updates detected from upstream feeds. Skipping full browser tests and deployment to conserve Actions minutes."
            else
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "Catalog updates detected! Proceeding to test, commit, and deploy."
            fi
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Event is ${{ github.event_name }}. Proceeding to full test and deployment."
          fi

      - uses: actions/setup-node@v4
        if: steps.check_proceed.outputs.should_run == 'true'
        with:
          node-version: '24'
          cache: npm

      - name: Install development tools
        if: steps.check_proceed.outputs.should_run == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate browser smoke and UI
        if: steps.check_proceed.outputs.should_run == 'true'
        run: npm test

      - name: Save refreshed metadata
        if: steps.check_proceed.outputs.should_run == 'true' && github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json app.js .sync/report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public patch metadata'
            git push
          fi

      - name: Stage static files
        if: steps.check_proceed.outputs.should_run == 'true'
        run: |
          mkdir public
          cp index.html app.js styles.css theme-init.js theme-controls.js catalog.json teams.json platforms.json public/
          cp -r assets public/
          touch public/.nojekyll
          python -c "import json,os,pathlib,subprocess; pathlib.Path('public/deployment.json').write_text(json.dumps(dict(commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),workflowHeadSha=os.environ['GITHUB_SHA'],runId=os.environ['GITHUB_RUN_ID'])))"

      - uses: actions/upload-pages-artifact@v3
        if: steps.check_proceed.outputs.should_run == 'true'
        with:
          path: public

      - name: Deploy
        if: steps.check_proceed.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
